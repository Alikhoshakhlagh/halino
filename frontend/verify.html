<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf9f5">
  <title>تأیید کد | حالینو</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <main class="page page--no-tabbar auth">
    <section class="auth__intro">
      <h1 class="auth__title">کد تأیید</h1>
      <p class="auth__lead">کدی که به شماره‌ی <span id="phone-text"></span> فرستادیم رو وارد کن.</p>
    </section>

    <section class="auth__box">
      <p class="auth__dev-code" id="dev-code" hidden></p>
      <form class="form" id="verify-form" novalidate>
        <div class="field">
          <label class="label" for="code">کد ۶ رقمی</label>
          <input class="input input--code" type="text" inputmode="numeric" id="code" maxlength="6" autocomplete="one-time-code" aria-describedby="code-error" autofocus>
          <p class="field-error" id="code-error" role="alert"></p>
        </div>
        <button class="btn btn--primary btn--block" type="submit">ورود</button>
      </form>
      <a class="link" href="login.html">تغییر شماره</a>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth/verify.js"></script>
</body>
</html>
