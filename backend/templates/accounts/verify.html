{% extends "base.html" %}
{% block title %}تأیید کد — حالینو{% endblock %}

{% block content %}
<section class="auth">
  <span class="auth__mark" aria-hidden="true"><svg class="icon"><use href="#i-key"/></svg></span>
  <div>
    <h1 class="auth__title">کد تأیید</h1>
    <p class="lead">کدی که برات فرستادیم رو وارد کن.</p>
  </div>
</section>

<div class="card">
  <form method="post" class="form">
    {% csrf_token %}
    <label class="label" for="id_code">کد ۶ رقمی</label>
    <input class="input input--code" type="text" inputmode="numeric" id="id_code"
           name="code" maxlength="6" autocomplete="one-time-code" required autofocus>
    {% if form.code.errors %}<p class="error">{{ form.code.errors.0 }}</p>{% endif %}
    <button class="btn btn--primary btn--block" type="submit">ورود</button>
  </form>
  <a class="link" href="{% url 'login' %}">تغییر شماره</a>
</div>
{% endblock %}
